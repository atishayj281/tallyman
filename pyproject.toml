[project]
name = "tallyman"
version = "0.1.0"
description = "Natural-language analytics over a governed warehouse mart"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs running services"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
